      <text x="0" y="230"><tspan class="key">pubkey ED A</tspan><tspan x="140" class="val">SHA256:aM9Hk/02y9OQrnl99WfCP0Ory9eL09JsfnBf1mpiEv4</tspan></text>
      <text x="0" y="255"><tspan class="key">pubkey ED S</tspan><tspan x="140" class="val">SHA256:CqpPJfSQ/XmmgGN5oMi1OwUpkPtL/d1GVtXL4cg/v+c</tspan></text>

      <text x="0" y="305"><tspan class="cmd"># cat</tspan><tspan class="cmd-arg"> /proc/current_focus</tspan></text>

      <text x="0" y="335"><tspan class="prompt">&gt;</tspan><tspan class="val" dx="10">Engineering memory-safe cryptographic suites</tspan></text>
      <text x="0" y="360"><tspan class="prompt">&gt;</tspan><tspan class="val" dx="10">Fuzzing cryptographic handshakes and authentication flows</tspan></text>
      <text x="0" y="385"><tspan class="prompt">&gt;</tspan><tspan class="val" dx="10">Hardening systems against side-channel vulnerabilities</tspan></text>
