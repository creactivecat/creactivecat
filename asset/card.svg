

<svg width="900" height="500" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title { font: bold 22px 'Courier New', Consolas, monospace; fill: #ffffff; }
    .subtitle { font: 14px 'Courier New', Consolas, monospace; fill: #8b949e; letter-spacing: 1px; }
    .line { stroke: #21262d; stroke-width: 1; }
    .key { font: 14px 'Courier New', Consolas, monospace; fill: #8b949e; }
    .val { font: 14px 'Courier New', Consolas, monospace; fill: #c9d1d9; }
    .cmd { font: bold 14px 'Courier New', Consolas, monospace; fill: #c9d1d9; }
    .cmd-arg { font: 14px 'Courier New', Consolas, monospace; fill: #c9d1d9; }
    .prompt { font: bold 14px 'Courier New', Consolas, monospace; fill: #3fb950; }
    .container { animation: fadeIn 0.8s ease-in forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>

  <rect width="898" height="498" x="1" y="1" fill="#0d1117" rx="10" stroke="#21262d" stroke-width="1" />

