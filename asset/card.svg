      <text x="0" y="100"><tspan class="key">Location</tspan><tspan x="140" class="val">Milan, Italy</tspan></text>
      <text x="0" y="125"><tspan class="key">Focus</tspan><tspan x="140" class="val">DevSecOPS - MLOPS - CryptOPS</tspan></text>

      <text x="0" y="175"><tspan class="cmd"># ping</tspan><tspan class="cmd-arg"> --target CreactiveCAT</tspan></text>

